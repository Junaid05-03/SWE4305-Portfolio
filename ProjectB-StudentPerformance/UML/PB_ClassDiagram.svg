<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
<polygon points="1,1 11,6 1,11" fill="none" stroke="#333" stroke-width="1.5"/>
</marker>
<marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="10" markerHeight="8" orient="auto">
<polygon points="7,1 13,5 7,9 1,5" fill="none" stroke="#333" stroke-width="1"/>
</marker>
</defs>

<text font-size="16" font-weight="bold" x="340" y="26" text-anchor="middle" fill="#1F3864">Project B - Student Performance System</text>
<text font-size="13" x="340" y="44" text-anchor="middle" fill="#555">Class Diagram</text>

<!-- Person abstract -->
<rect x="240" y="56" width="200" height="30" rx="4" fill="#5F5E5A" stroke="#5F5E5A"/>
<text font-size="13" font-weight="bold" x="340" y="74" text-anchor="middle" dominant-baseline="central" fill="white">«abstract» Person</text>
<rect x="240" y="86" width="200" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="252" y="104" fill="#333"># id: int</text>
<text font-size="12" x="252" y="120" fill="#333"># name: String</text>
<line x1="240" y1="128" x2="440" y2="128" stroke="#333" stroke-width="0.5"/>
<rect x="240" y="128" width="200" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="252" y="146" fill="#333">+ getId(): int</text>
<text font-size="12" x="252" y="162" fill="#333">+ print(): void {abstract}</text>
<rect x="240" y="86" width="200" height="84" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Student -->
<rect x="240" y="210" width="200" height="30" rx="4" fill="#185FA5" stroke="#185FA5"/>
<text font-size="13" font-weight="bold" x="340" y="228" text-anchor="middle" dominant-baseline="central" fill="white">Student</text>
<rect x="240" y="240" width="200" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="252" y="258" fill="#333">- email: String</text>
<text font-size="12" x="252" y="274" fill="#333">- enrolledModuleCodes: List</text>
<line x1="240" y1="282" x2="440" y2="282" stroke="#333" stroke-width="0.5"/>
<rect x="240" y="282" width="200" height="58" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="252" y="300" fill="#333">+ print(): void {override}</text>
<text font-size="12" x="252" y="316" fill="#333">+ enrol(code): void</text>
<text font-size="12" x="252" y="332" fill="#333">+ getEmail(): String</text>
<rect x="240" y="240" width="200" height="100" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Inheritance arrow -->
<line x1="340" y1="210" x2="340" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#inherit)"/>
<text font-size="11" x="352" y="194" fill="#555">extends</text>

<!-- Module -->
<rect x="480" y="56" width="180" height="30" rx="4" fill="#0F6E56" stroke="#0F6E56"/>
<text font-size="13" font-weight="bold" x="570" y="74" text-anchor="middle" dominant-baseline="central" fill="white">Module</text>
<rect x="480" y="86" width="180" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="492" y="104" fill="#333">- code: String</text>
<text font-size="12" x="492" y="120" fill="#333">- name: String</text>
<line x1="480" y1="128" x2="660" y2="128" stroke="#333" stroke-width="0.5"/>
<rect x="480" y="128" width="180" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="492" y="146" fill="#333">+ getCode(): String</text>
<text font-size="12" x="492" y="162" fill="#333">+ print(): void</text>
<rect x="480" y="86" width="180" height="84" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Mark -->
<rect x="480" y="210" width="180" height="30" rx="4" fill="#BA7517" stroke="#BA7517"/>
<text font-size="13" font-weight="bold" x="570" y="228" text-anchor="middle" dominant-baseline="central" fill="white">Mark</text>
<rect x="480" y="240" width="180" height="56" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="492" y="258" fill="#333">- studentId: int</text>
<text font-size="12" x="492" y="274" fill="#333">- moduleCode: String</text>
<text font-size="12" x="492" y="290" fill="#333">- value: int</text>
<line x1="480" y1="296" x2="660" y2="296" stroke="#333" stroke-width="0.5"/>
<rect x="480" y="296" width="180" height="42" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="492" y="314" fill="#333">+ getGrade(): Grade</text>
<text font-size="12" x="492" y="330" fill="#333">+ getValue(): int</text>
<rect x="480" y="240" width="180" height="98" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Grade enum -->
<rect x="480" y="372" width="180" height="30" rx="4" fill="#993C1D" stroke="#993C1D"/>
<text font-size="13" font-weight="bold" x="570" y="390" text-anchor="middle" dominant-baseline="central" fill="white">«enum» Grade</text>
<rect x="480" y="402" width="180" height="72" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="11" x="492" y="420" fill="#333">A (First Class, 70-100)</text>
<text font-size="11" x="492" y="436" fill="#333">B (Upper Second, 60-69)</text>
<text font-size="11" x="492" y="452" fill="#333">C (Lower Second, 50-59)</text>
<text font-size="11" x="492" y="468" fill="#333">D (Third Class, 40-49)</text>
<line x1="480" y1="472" x2="660" y2="472" stroke="#333" stroke-width="0.5"/>
<rect x="480" y="472" width="180" height="28" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="492" y="490" fill="#333">+ fromMark(int): Grade</text>
<rect x="480" y="402" width="180" height="98" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- StudentManager -->
<rect x="20" y="56" width="196" height="30" rx="4" fill="#534AB7" stroke="#534AB7"/>
<text font-size="13" font-weight="bold" x="118" y="74" text-anchor="middle" dominant-baseline="central" fill="white">StudentManager</text>
<rect x="20" y="86" width="196" height="28" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="11" x="32" y="104" fill="#333">- students: HashMap&lt;Int,Student&gt;</text>
<line x1="20" y1="114" x2="216" y2="114" stroke="#333" stroke-width="0.5"/>
<rect x="20" y="114" width="196" height="72" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="32" y="132" fill="#333">+ addStudent(): boolean</text>
<text font-size="12" x="32" y="148" fill="#333">+ editStudent(): boolean</text>
<text font-size="12" x="32" y="164" fill="#333">+ deleteStudent(): boolean</text>
<text font-size="12" x="32" y="180" fill="#333">+ getStudent(id): Student</text>
<rect x="20" y="86" width="196" height="100" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- ModuleManager -->
<rect x="20" y="230" width="196" height="30" rx="4" fill="#534AB7" stroke="#534AB7"/>
<text font-size="13" font-weight="bold" x="118" y="248" text-anchor="middle" dominant-baseline="central" fill="white">ModuleManager</text>
<rect x="20" y="260" width="196" height="28" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="11" x="32" y="278" fill="#333">- modules: HashMap&lt;Str,Module&gt;</text>
<line x1="20" y1="288" x2="216" y2="288" stroke="#333" stroke-width="0.5"/>
<rect x="20" y="288" width="196" height="72" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="32" y="306" fill="#333">+ addModule(): boolean</text>
<text font-size="12" x="32" y="322" fill="#333">+ editModule(): boolean</text>
<text font-size="12" x="32" y="338" fill="#333">+ deleteModule(): boolean</text>
<text font-size="12" x="32" y="354" fill="#333">+ getModule(code): Module</text>
<rect x="20" y="260" width="196" height="100" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- MarkManager -->
<rect x="20" y="404" width="196" height="30" rx="4" fill="#534AB7" stroke="#534AB7"/>
<text font-size="13" font-weight="bold" x="118" y="422" text-anchor="middle" dominant-baseline="central" fill="white">MarkManager</text>
<rect x="20" y="434" width="196" height="28" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="11" x="32" y="452" fill="#333">- marks: ArrayList&lt;Mark&gt;</text>
<line x1="20" y1="462" x2="216" y2="462" stroke="#333" stroke-width="0.5"/>
<rect x="20" y="462" width="196" height="88" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="32" y="480" fill="#333">+ addMark(): boolean</text>
<text font-size="12" x="32" y="496" fill="#333">+ getMeanMark(code): double</text>
<text font-size="12" x="32" y="512" fill="#333">+ getMinMark(code): int</text>
<text font-size="12" x="32" y="528" fill="#333">+ getGradeDistribution(): Map</text>
<rect x="20" y="434" width="196" height="116" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Dependency lines -->
<line x1="216" y1="120" x2="238" y2="248" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="216" y1="295" x2="478" y2="120" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="216" y1="460" x2="478" y2="338" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="570" y1="338" x2="570" y2="370" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="20" y="600" width="640" height="84" rx="6" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2"/>
<text font-size="13" font-weight="bold" x="40" y="620" fill="#333">Legend</text>
<line x1="40" y1="638" x2="90" y2="638" stroke="#333" stroke-width="1.5" marker-end="url(#inherit)"/>
<text font-size="12" x="100" y="642" fill="#333">Inheritance (Student extends Person)</text>
<line x1="320" y1="638" x2="370" y2="638" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text font-size="12" x="380" y="642" fill="#333">Dependency (Manager uses class)</text>
<text font-size="11" x="40" y="670" fill="#555"># = protected   - = private   + = public   HashMap = O(1) lookup</text>
</svg>
