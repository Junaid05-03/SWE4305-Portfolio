<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title -->
<text font-size="16" font-weight="bold" x="340" y="30" text-anchor="middle" fill="#1F3864">Project A - Playlist Application</text>
<text font-size="13" x="340" y="48" text-anchor="middle" fill="#555">Use-Case Diagram</text>

<!-- System boundary -->
<rect x="180" y="60" width="420" height="390" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="6 3"/>
<text font-size="12" x="390" y="78" text-anchor="middle" fill="#333">Playlist Application</text>

<!-- Use cases -->
<ellipse cx="390" cy="130" rx="90" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-size="13" font-weight="bold" x="390" y="134" text-anchor="middle" dominant-baseline="central" fill="#085041">Add Song</text>

<ellipse cx="390" cy="200" rx="90" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-size="13" font-weight="bold" x="390" y="204" text-anchor="middle" dominant-baseline="central" fill="#085041">Remove Song</text>

<ellipse cx="390" cy="270" rx="90" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-size="13" font-weight="bold" x="390" y="274" text-anchor="middle" dominant-baseline="central" fill="#085041">View All Songs</text>

<ellipse cx="390" cy="340" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-size="13" font-weight="bold" x="390" y="344" text-anchor="middle" dominant-baseline="central" fill="#085041">Filter by Play Count</text>

<ellipse cx="390" cy="410" rx="90" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-size="13" font-weight="bold" x="390" y="414" text-anchor="middle" dominant-baseline="central" fill="#085041">Search by Artist</text>

<!-- Actor -->
<circle cx="90" cy="130" r="18" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="90" y1="148" x2="90" y2="200" stroke="#333" stroke-width="1.5"/>
<line x1="62" y1="168" x2="118" y2="168" stroke="#333" stroke-width="1.5"/>
<line x1="90" y1="200" x2="65" y2="230" stroke="#333" stroke-width="1.5"/>
<line x1="90" y1="200" x2="115" y2="230" stroke="#333" stroke-width="1.5"/>
<text font-size="13" font-weight="bold" x="90" y="250" text-anchor="middle" fill="#333">User</text>

<!-- Lines from actor to use cases -->
<line x1="108" y1="130" x2="298" y2="130" stroke="#333" stroke-width="1"/>
<line x1="108" y1="145" x2="298" y2="200" stroke="#333" stroke-width="1"/>
<line x1="108" y1="155" x2="298" y2="270" stroke="#333" stroke-width="1"/>
<line x1="108" y1="165" x2="283" y2="340" stroke="#333" stroke-width="1"/>
<line x1="108" y1="175" x2="298" y2="410" stroke="#333" stroke-width="1"/>

<!-- Validation note -->
<rect x="530" y="100" width="126" height="60" rx="6" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2"/>
<text font-size="11" x="593" y="122" text-anchor="middle" fill="#333">«include»</text>
<text font-size="11" x="593" y="138" text-anchor="middle" fill="#333">Input</text>
<text font-size="11" x="593" y="152" text-anchor="middle" fill="#333">Validation</text>
<line x1="482" y1="130" x2="528" y2="130" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
<line x1="482" y1="200" x2="528" y2="145" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
</svg>
