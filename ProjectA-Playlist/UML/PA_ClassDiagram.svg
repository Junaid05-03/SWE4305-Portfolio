<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="10" markerHeight="8" orient="auto">
<polygon points="7,1 13,5 7,9 1,5" fill="none" stroke="#333" stroke-width="1"/>
</marker>
</defs>

<text font-size="16" font-weight="bold" x="340" y="26" text-anchor="middle" fill="#1F3864">Project A - Playlist Application</text>
<text font-size="13" x="340" y="44" text-anchor="middle" fill="#555">Class Diagram</text>

<!-- Song -->
<rect x="40" y="60" width="200" height="30" rx="4" fill="#185FA5" stroke="#185FA5"/>
<text font-size="14" font-weight="bold" x="140" y="79" text-anchor="middle" dominant-baseline="central" fill="white">Song</text>
<rect x="40" y="90" width="200" height="72" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="52" y="108" fill="#333">- title: String</text>
<text font-size="12" x="52" y="124" fill="#333">- artist: String</text>
<text font-size="12" x="52" y="140" fill="#333">- playCount: int</text>
<line x1="40" y1="150" x2="240" y2="150" stroke="#333" stroke-width="0.5"/>
<rect x="40" y="150" width="200" height="102" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="52" y="168" fill="#333">+ getTitle(): String</text>
<text font-size="12" x="52" y="184" fill="#333">+ getArtist(): String</text>
<text font-size="12" x="52" y="200" fill="#333">+ getPlayCount(): int</text>
<text font-size="12" x="52" y="216" fill="#333">+ print(): void</text>
<text font-size="12" x="52" y="232" fill="#333">+ toString(): String</text>
<rect x="40" y="90" width="200" height="162" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- PlaylistManager -->
<rect x="280" y="60" width="220" height="30" rx="4" fill="#534AB7" stroke="#534AB7"/>
<text font-size="14" font-weight="bold" x="390" y="79" text-anchor="middle" dominant-baseline="central" fill="white">PlaylistManager</text>
<rect x="280" y="90" width="220" height="24" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="292" y="106" fill="#333">- songs: ArrayList&lt;Song&gt;</text>
<line x1="280" y1="114" x2="500" y2="114" stroke="#333" stroke-width="0.5"/>
<rect x="280" y="114" width="220" height="138" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="292" y="132" fill="#333">- loadDefaultSongs(): void</text>
<text font-size="12" x="292" y="148" fill="#333">+ addSong(t,a,p): void</text>
<text font-size="12" x="292" y="164" fill="#333">+ removeSong(title): void</text>
<text font-size="12" x="292" y="180" fill="#333">+ printAllSongs(): void</text>
<text font-size="12" x="292" y="196" fill="#333">+ filterByPlayCount(n): void</text>
<text font-size="12" x="292" y="212" fill="#333">+ searchByArtist(a): void</text>
<text font-size="12" x="292" y="228" fill="#333">+ getSongs(): ArrayList</text>
<rect x="280" y="90" width="220" height="162" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Main -->
<rect x="540" y="60" width="120" height="30" rx="4" fill="#5F5E5A" stroke="#5F5E5A"/>
<text font-size="14" font-weight="bold" x="600" y="79" text-anchor="middle" dominant-baseline="central" fill="white">Main</text>
<rect x="540" y="90" width="120" height="24" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="600" y="106" text-anchor="middle" fill="#888">(no fields)</text>
<line x1="540" y1="114" x2="660" y2="114" stroke="#333" stroke-width="0.5"/>
<rect x="540" y="114" width="120" height="24" fill="white" stroke="#333" stroke-width="0.5"/>
<text font-size="12" x="552" y="130" fill="#333">+ main(): void</text>
<rect x="540" y="90" width="120" height="48" fill="none" stroke="#333" stroke-width="0.5"/>

<!-- Aggregation line -->
<line x1="280" y1="155" x2="242" y2="155" stroke="#333" stroke-width="1" marker-start="url(#diamond)"/>
<text font-size="11" x="284" y="148" fill="#333">1</text>
<text font-size="11" x="220" y="148" fill="#333">0..*</text>

<!-- Dependency line -->
<line x1="540" y1="130" x2="502" y2="130" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text font-size="11" x="521" y="122" text-anchor="middle" fill="#333">«uses»</text>

<!-- Legend -->
<rect x="40" y="300" width="580" height="90" rx="6" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2"/>
<text font-size="13" font-weight="bold" x="60" y="320" fill="#333">Legend</text>
<line x1="60" y1="340" x2="110" y2="340" stroke="#333" stroke-width="1" marker-start="url(#diamond)"/>
<text font-size="12" x="120" y="344" fill="#333">Aggregation (1 PlaylistManager contains 0..* Songs)</text>
<line x1="60" y1="364" x2="110" y2="364" stroke="#333" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text font-size="12" x="120" y="368" fill="#333">Dependency (Main depends on PlaylistManager)</text>
</svg>
